stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.7.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

image:
  name: hashicorp/terraform:$TF_VERSION
  entrypoint:
    - "/usr/bin/env"
    - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

before_script:
  - terraform --version
  - apk add --no-cache aws-cli
  - aws --version
  - git config --global url."https://oauth2:${GITLAB_CI_TEST_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"

# ==========================================
# DEVELOPMENT ENVIRONMENT
# ==========================================

validate-dev:
  stage: validate
  variables:
    AWS_ACCESS_KEY_ID: $DEV_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $DEV_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-dev.tfvars -var-file="environments/dev.tfvars"
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never

plan-dev:
  stage: plan
  variables:
    AWS_ACCESS_KEY_ID: $DEV_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $DEV_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-dev.tfvars
    - terraform plan -var-file="environments/dev.tfvars" -out=tfplan-dev
  dependencies:
    - validate-dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never

apply-dev:
  stage: apply
  timeout: 3h
  variables:
    AWS_ACCESS_KEY_ID: $DEV_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $DEV_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-dev.tfvars
    - terraform plan -var-file="environments/dev.tfvars" -out=tfplan-dev
    - terraform apply -auto-approve tfplan-dev
  dependencies:
    - plan-dev
  when: manual
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never

