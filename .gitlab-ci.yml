# ==========================================
# PRODUCTION ENVIRONMENT
# ==========================================

validate-prd:
  stage: validate
  variables:
    AWS_ACCESS_KEY_ID: $PRD_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $PRD_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-prd.tfvars -var-file="environments/prd.tfvars"
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

plan-prd:
  stage: plan
  variables:
    AWS_ACCESS_KEY_ID: $PRD_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $PRD_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-prd.tfvars
    - terraform plan -var-file="environments/prd.tfvars" -out=tfplan-prd
  dependencies:
    - validate-prd
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

apply-prd:
  stage: apply
  timeout: 6h
  variables:
    AWS_ACCESS_KEY_ID: $PRD_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $PRD_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_REGION
  script:
    - terraform init -backend-config=backend-configs/backend-prd.tfvars
    - terraform plan -var-file="environments/prd.tfvars" -out=tfplan-prd
    - terraform apply -auto-approve tfplan-prd
